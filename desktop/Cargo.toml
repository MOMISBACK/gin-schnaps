[package]
name = "gin-schnaps"
version = "0.8.4"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["custom-protocol"] }
serde_json = "1"

base64 = "=0.22.1"
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
tauri-plugin-dialog = "=2.7.2"

[features]
io-test = []
