name: Materialize exact reviewed workspace patch
on:
  push:
    branches: [integration/workspace-exports]
    paths: ['.workspace-transfer/**', '.github/workflows/materialize-workspace.yml']
permissions:
  contents: read
jobs:
  verify:
    if: "startsWith(github.event.head_commit.message, 'chore: stage workspace patch')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate base, transfer and target tree without executing code
        run: |
          test "$(git ls-tree -r --name-only HEAD .workspace-transfer/workspace.patch.xz)" = .workspace-transfer/workspace.patch.xz
          echo 'c3e7775dacfc7b9b0e479e2d149a5e8f11b4fb38aa53c2cf5825ff0d0ccdff53  .workspace-transfer/workspace.patch.xz' | sha256sum -c -
          xz -d -c .workspace-transfer/workspace.patch.xz > /tmp/workspace.patch
          git apply --index --check /tmp/workspace.patch
          git apply --index /tmp/workspace.patch
          git rm -r .workspace-transfer .github/workflows/materialize-workspace.yml
          test "$(git write-tree)" = b248883b9563e96eff5c669925e14c8572ed8404
  record:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/workspace-exports
      - name: Commit only the exact verified files on the integration branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-tree -r --name-only HEAD .workspace-transfer/workspace.patch.xz)" = .workspace-transfer/workspace.patch.xz
          echo 'c3e7775dacfc7b9b0e479e2d149a5e8f11b4fb38aa53c2cf5825ff0d0ccdff53  .workspace-transfer/workspace.patch.xz' | sha256sum -c -
          xz -d -c .workspace-transfer/workspace.patch.xz > /tmp/workspace.patch
          git apply --index --check /tmp/workspace.patch
          git apply --index /tmp/workspace.patch
          git rm -r .workspace-transfer .github/workflows/materialize-workspace.yml
          test "$(git write-tree)" = b248883b9563e96eff5c669925e14c8572ed8404
          git restore --source=HEAD --staged --worktree .github/workflows/materialize-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: split sequence and map, editor shortcuts and exchange formats'
          git push origin HEAD:integration/workspace-exports
