name: Publish tested downloads
on:
  workflow_run:
    workflows: ['Build, test and preview release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional successful main build ID; empty selects the latest successful main build.'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: gin-schnaps-publication
  cancel-in-progress: false
jobs:
  select:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verified.outputs.sha }}
      run: ${{ steps.verified.outputs.run }}
    steps:
      - name: Verify a successful same-repository main build and every required job
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],text=True))
          chosen=event.get('workflow_run',{}).get('id') or (event.get('inputs') or {}).get('run_id')
          if not chosen:
              runs=api('actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20')['workflow_runs']
              if not runs:raise SystemExit('No successful main build to publish.')
              chosen=runs[0]['id']
          assert re.fullmatch(r'[0-9]+',str(chosen))
          run=api(f'actions/runs/{chosen}')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/ci.yml' and run['event']=='push' and run['head_branch']=='main'
          assert run['repository']['full_name']==repo and run['head_repository']['full_name']==repo
          assert re.fullmatch(r'[0-9a-f]{40}',run['head_sha'])
          jobs=api(f'actions/runs/{chosen}/jobs?filter=latest&per_page=100');assert jobs['total_count']<=100
          required={'Check ubuntu-latest','Check windows-latest','Check macos-latest','rust-audit','Required checks',
                    'native (ubuntu-24.04)','native (windows-latest)','native (macos-latest)','native (macos-15-intel)'}
          for name in required:
              matches=[j for j in jobs['jobs'] if j['name']==name]
              assert len(matches)==1 and matches[0]['conclusion']=='success',f'Missing or unsuccessful job: {name}'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write(f"run={chosen}\nsha={run['head_sha']}\n")
          PY
  publish:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main ancestry
        env:
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA" && git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select.outputs.run }}
          path: downloaded
      - name: Validate complete exact-commit packages
        env:
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
        run: env GITHUB_SHA="$SOURCE_SHA" python3 scripts/prepare-release.py
      - name: Publish without replacing a version or reusing it for other code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
        run: python3 scripts/publish-release.py
  public-downloads:
    needs: [select, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - name: Retrieve public assets without authentication and inspect their contents
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          python3 scripts/verify-public-release.py "$GITHUB_REPOSITORY" "$version" "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-download-verification
          path: test-results/public-downloads.json
          retention-days: 14
