name: Prepare portable document backups
on:
  push:
    branches: [feat/0.8.6-document-backups]
    paths: ['.backup-transfer/**', '.github/workflows/prepare-backups.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'stage portable backups')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize and check the exact candidate tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma
          encoded=''.join(Path(f'.backup-transfer/part{i}.b64').read_text() for i in range(3))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='4f559a60164b09e0667123b7225fa5b2e96a5da5359afdaaba4bd7efea6bb22c'
          Path('/tmp/backups.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --index --unidiff-zero /tmp/backups.patch
          git rm -r .backup-transfer .github/workflows/prepare-backups.yml
          test "$(git write-tree)" = 'd632acb098886149ba2cd85d1a9199db33633b6f'
      - name: Install exact locked dependencies and validate
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
      - name: Run the new backup workflow in a real local-file browser
        run: |
          python3 -m pip install playwright==1.58.0 biopython==1.86
          python3 -m playwright install --with-deps chromium
          npm run test:backups
      - name: Keep review artifacts
        if: always()
        run: |
          test ! -d node_modules/events || tar -czf /tmp/events-sources.tar.gz -C node_modules events
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-backup-preparation
          path: |
            test-results/
            dist/index.html
            dist/diagnostic.html
            dist/BUILD-METRICS.json
            /tmp/events-sources.tar.gz
          retention-days: 7
  record:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/0.8.6-document-backups
      - name: Record only the inspected source tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma
          encoded=''.join(Path(f'.backup-transfer/part{i}.b64').read_text() for i in range(3))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='4f559a60164b09e0667123b7225fa5b2e96a5da5359afdaaba4bd7efea6bb22c'
          Path('/tmp/backups.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --index --unidiff-zero /tmp/backups.patch
          git rm -r .backup-transfer .github/workflows/prepare-backups.yml
          test "$(git write-tree)" = 'd632acb098886149ba2cd85d1a9199db33633b6f'
          git restore --source=HEAD --staged --worktree .github/workflows/prepare-backups.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add portable document backups and explicit PCR draft restoration'
          git push origin HEAD:feat/0.8.6-document-backups
