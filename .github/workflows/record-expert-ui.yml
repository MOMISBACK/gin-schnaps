name: Record reviewed expert interface
on:
  push:
    branches: [ui/0.8.4-expert-copy]
    paths: ['.ui-transfer/**', '.github/workflows/record-expert-ui.yml']
permissions:
  contents: read
jobs:
  record:
    if: "startsWith(github.event.head_commit.message, 'chore: transfer reviewed expert')"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ui/0.8.4-expert-copy
      - name: Record only the exact reviewed source without executing application code
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat .ui-transfer/part{0,1,2}.xz > /tmp/expert-copy.patch.xz
          echo 'b858c285f5fc02728a8030ef8879e4426581ea4b47c0e46580363302fc581d55  /tmp/expert-copy.patch.xz' | sha256sum -c -
          python3 -c "import lzma,pathlib;pathlib.Path('/tmp/expert-copy.patch').write_bytes(lzma.decompress(pathlib.Path('/tmp/expert-copy.patch.xz').read_bytes()))"
          git apply --index --unidiff-zero /tmp/expert-copy.patch
          git rm -r .ui-transfer .github/workflows/record-expert-ui.yml
          test "$(git write-tree)" = '0de4115b4cac85bd0649131583f52cff9cb21507'
          git restore --source=HEAD --staged --worktree .github/workflows/record-expert-ui.yml .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: stage reviewed compact expert interface and contextual help'
          git push origin HEAD:ui/0.8.4-expert-copy
