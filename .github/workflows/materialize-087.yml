name: Verify editing and navigation source transfer
on:
  push:
    branches: [feat/0.8.7-editing-navigation]
    paths: ['.transfer-087/**', '.github/workflows/materialize-087.yml']
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'transfer 0.8.7')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize only the hash-identified source tree
        run: |
          cat .transfer-087/part0.xz .transfer-087/part1.xz > /tmp/change.xz
          echo '826cbf9a8ac9664fdc6bb0638d89346944ede46d70eb570bb9bd4515eb356d6a  /tmp/change.xz' | sha256sum -c -
          python3 -c "import lzma,pathlib;pathlib.Path('/tmp/change.patch').write_bytes(lzma.decompress(pathlib.Path('/tmp/change.xz').read_bytes()))"
          git apply --index --unidiff-zero /tmp/change.patch
          git rm -r .transfer-087 .github/workflows/materialize-087.yml
          test "$(git write-tree)" = '97e3c6e9f088032b1c1e02ac0915e7e9c164cecd'
      - name: Validate models, build and new real-file browser workflows
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          npm run test:interactive-editing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editing-navigation-preparation
          path: test-results/
          retention-days: 7
  record:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/0.8.7-editing-navigation
      - name: Record verified sources without executing application code
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat .transfer-087/part0.xz .transfer-087/part1.xz > /tmp/change.xz
          echo '826cbf9a8ac9664fdc6bb0638d89346944ede46d70eb570bb9bd4515eb356d6a  /tmp/change.xz' | sha256sum -c -
          python3 -c "import lzma,pathlib;pathlib.Path('/tmp/change.patch').write_bytes(lzma.decompress(pathlib.Path('/tmp/change.xz').read_bytes()))"
          git apply --index --unidiff-zero /tmp/change.patch
          git rm -r .transfer-087 .github/workflows/materialize-087.yml
          test "$(git write-tree)" = '97e3c6e9f088032b1c1e02ac0915e7e9c164cecd'
          git restore --source=HEAD --staged --worktree .github/workflows/materialize-087.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add tested map mouse controls and guarded exact-join editing'
          git push origin HEAD:feat/0.8.7-editing-navigation
