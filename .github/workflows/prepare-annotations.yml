name: Verify annotation source import
on:
  push:
    branches: [feat/0.8.8-annotations]
    paths: ['.annotations-transfer/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize only the exact reviewed source
        run: |
          cat .annotations-transfer/part{0,1,2,3,4,5}.xz > /tmp/annotations.patch.xz
          echo '7f363b25dcb7224da38b1746887d0125ab8fd02d99792e01a3102e2c678b0546  /tmp/annotations.patch.xz' | sha256sum -c -
          python3 -c "import lzma,pathlib;pathlib.Path('/tmp/annotations.patch').write_bytes(lzma.decompress(pathlib.Path('/tmp/annotations.patch.xz').read_bytes()))"
          git apply --index --unidiff-zero /tmp/annotations.patch
          git rm -r .annotations-transfer .github/workflows/prepare-annotations.yml
          test "$(git write-tree)" = '32fc11ab675c4db99cfbd0cb2e09855024cc4aa4'
      - name: Validate locked source without publishing
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
  record:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/0.8.8-annotations
      - name: Record exact verified source without executing application code
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat .annotations-transfer/part{0,1,2,3,4,5}.xz > /tmp/annotations.patch.xz
          echo '7f363b25dcb7224da38b1746887d0125ab8fd02d99792e01a3102e2c678b0546  /tmp/annotations.patch.xz' | sha256sum -c -
          python3 -c "import lzma,pathlib;pathlib.Path('/tmp/annotations.patch').write_bytes(lzma.decompress(pathlib.Path('/tmp/annotations.patch.xz').read_bytes()))"
          git apply --index --unidiff-zero /tmp/annotations.patch
          git rm -r .annotations-transfer .github/workflows/prepare-annotations.yml
          test "$(git write-tree)" = '32fc11ab675c4db99cfbd0cb2e09855024cc4aa4'
          git restore --source=HEAD --staged --worktree .github/workflows/prepare-annotations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: coherent annotation edits, shared projection and structured clipboard'
          git push origin HEAD:feat/0.8.8-annotations
