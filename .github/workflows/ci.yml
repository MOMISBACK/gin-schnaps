name: Build, test and preview release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: gin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Offline native notice cache checks
        run: python3 tests/native-notices-test.py
      - name: Typecheck, domain tests and standalone build
        run: npm run check
      - name: Record actual test environment
        run: |
          python3 - <<'PY'
          import json, platform, pathlib, subprocess
          path = pathlib.Path('test-results'); path.mkdir(exist_ok=True)
          (path / 'environment.json').write_text(json.dumps({'system': platform.system(), 'release': platform.release(), 'machine': platform.machine(), 'python': platform.python_version(), 'node': subprocess.check_output(['node','--version'], text=True).strip(), 'applicationType': 'standalone HTML in Chromium; not a native installer'}, indent=2))
          PY
      - name: Browser and independent reader tooling
        run: |
          python3 -m pip install playwright==1.58.0 biopython==1.86
          if [ "$RUNNER_OS" = Linux ]; then
            python3 -m playwright install --with-deps chromium
          else
            python3 -m playwright install chromium
          fi
      - name: Real file launch and existing interaction workflows
        run: npm run test:browser
      - name: Binary .dna import, GenBank export and persistent recovery
        run: npm run test:interop
      - name: Independent Biopython file verification
        run: npm run test:file-oracle
      - name: Circular keyboard regressions and synthetic diagnostics
        run: npm run test:consolidation
      - name: English workbench, transformations, search and graphics
        run: npm run test:workbench
      - name: Persistent oligos, locations and external interoperability corpus
        run: npm run test:documents
      - name: Journal capacity and unsaved PCR regressions
        run: npm run test:reliability
      - name: Independent compound-location and oligo oracle
        run: npm run test:documents-oracle
      - name: Verify the existing public download independently (Linux only)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python3 scripts/verify-public-release.py MOMISBACK/gin-schnaps 0.8.1 7827c92a26ba60120181010377a332c0bdabbcf4
      - name: Real cross-document copy and paste
        run: npm run test:clipboard
      - name: Expert interface, contextual help and preserved warnings
        run: npm run test:expert-ui
      - name: PCR products to documents with persistent provenance
        run: npm run test:pcr-documents
      - name: Portable document backups and PCR draft restoration
        run: npm run test:backups
      - name: Emitted-source dependency inventory
        run: npm run security:inventory
      - name: Known-advisory gate (not a security certification)
        if: always()
        run: npm audit --audit-level=high --json > dependency-audit.json
      - name: Package ready-to-open application and tracked sources
        if: success() && runner.os == 'Linux'
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workbench-validation-${{ matrix.os }}
          path: |
            test-results/
            dependency-audit.json
            dist/index.html
            dist/BUILD-METRICS.json
            dist/diagnostic.html
            dist/DIAGNOSTIC-METRICS.json
            gin-schnaps-*-browser.zip
            gin-schnaps-*-sources.zip
          retention-days: 14
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: System prerequisites
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            if [ "$RUNNER_ARCH" = X64 ]; then
              echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
            else
              echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
            fi
          fi
          rustup toolchain install 1.99.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: gin-schnaps-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            gin-schnaps-${{ matrix.os }}-${{ runner.arch }}-
      - name: Build frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          node scripts/prepare-desktop.mjs
          mkdir -p test-results
      - name: Retrieve exact Cargo archives and check offline notices
        run: |
          cargo +1.99.0 fetch --locked --manifest-path desktop/Cargo.toml
          python3 tests/native-notices-test.py
      - name: Native file-service tests
        run: |
          cargo +1.99.0 test --locked --manifest-path desktop/Cargo.toml 2>&1 | tee test-results/native-unit.log
      - name: Real native UI file workflows using test-only fixed picker
        run: |
          cargo +1.99.0 build --locked --features io-test --manifest-path desktop/Cargo.toml 2>&1 | tee test-results/native-build.log
          python3 tests/native-desktop.py
      - name: Build distributable without test controls
        run: cargo +1.99.0 build --release --locked --manifest-path desktop/Cargo.toml
      - name: Optimized native save failure regressions
        run: |
          cargo +1.99.0 test --release --locked --manifest-path desktop/Cargo.toml file_safety_tests -- --test-threads=1 2>&1 | tee test-results/native-save-release.log
          python3 scripts/check-native-save-tests.py
      - name: Production binary rendering probe
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export GIN_SCHNAPS_NATIVE_BINARY="$PWD/desktop/target/release/gin-schnaps.exe"
          else
            export GIN_SCHNAPS_NATIVE_BINARY="$PWD/desktop/target/release/gin-schnaps"
          fi
          python3 tests/native-probe.py
      - name: Package native preview and test macOS disk image
        run: python3 scripts/package-desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-preview-${{ matrix.os }}
          path: |
            desktop/Cargo.lock
            test-results/
            native-packages/*.dmg
            native-packages/*.zip
            native-packages/*.tar.gz
            native-packages/CHECKSUMS.json
            native-packages/NATIVE_THIRD_PARTY_NOTICES.md
          retention-days: 14
  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: rust-audit-linux-0.22.2
      - name: Install pinned advisory checker
        run: |
          if ! command -v cargo-audit >/dev/null; then
            cargo +1.99.0 install cargo-audit --locked --version 0.22.2 --no-default-features
          fi
          cargo audit --version
      - name: Check locked native dependencies against RustSec
        run: |
          mkdir -p test-results
          cargo +1.99.0 audit --file desktop/Cargo.lock --json > test-results/rust-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-advisory-report
          path: test-results/rust-audit.json
          retention-days: 14
  required:
    name: Required checks
    if: always()
    needs: [web, native, rust-audit]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every matrix and audit job
        env:
          WEB: ${{ needs.web.result }}
          NATIVE: ${{ needs.native.result }}
          AUDIT: ${{ needs.rust-audit.result }}
        run: test "$WEB" = success && test "$NATIVE" = success && test "$AUDIT" = success
